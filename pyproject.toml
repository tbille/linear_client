[project]
name = "linear-client"
version = "0.1.0"
description = "Python client for Linear GraphQL API"
authors = [
    {name = "Thomas Bille",email = "thomas.bille@studocu.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "sgqlc",
    "requests (>=2.32.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"

